<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>FIFA World Cup 2026 — Knockout Bracket</title><style>
:root{--bg:#050c0a;--card:#101f1b;--line:rgba(110,235,185,.16);--line2:rgba(110,235,185,.5);

*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:radial-gradient(1100px 650px at 50% -12%,#123a2e,#050c0a 60%);color:var(--txt);
font-family:'Segoe UI',system-ui,-apple-system,Helvetica,sans-serif;overflow:hidden}
header{position:fixed;top:0;left:0;right:0;z-index:50;background:linear-gradient(180deg,rgba(5,12,10,.92),rgba(5,12,10,.35));
padding:12px 20px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:8px;justify-content:center}
h1{font-size:1.35rem;font-weight:800;letter-spacing:.02em;text-shadow:0 0 18px rgba(61,216,127,.35)}
h1 .sub{color:var(--gold);font-weight:700}
.champ{margin-left:8px;font-weight:700;color:var(--gold);border:1px solid rgba(255,211,74,.5);
padding:3px 12px;border-radius:999px;background:rgba(255,211,74,.08);font-size:.85rem}
.legend{color:var(--dim);font-size:.78rem}
.wrap{position:absolute;inset:0;overflow:auto}
#stage{position:relative;margin:64px auto 80px;width:2560px;min-height:1340px}
.col{position:absolute;z-index:1;transform:translateX(-50%);font-size:.7rem;font-weight:800;
letter-spacing:.1em;color:var(--gold);text-transform:uppercase;white-space:nowrap;padding-bottom:6px}
.col.spread{letter-spacing:.3em}
.card{position:absolute;z-index:2;width:190px;height:60px;border-radius:11px;
background:linear-gradient(160deg,rgba(255,255,255,.05),transparent);border:1px solid var(--line);
cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
font-size:.82rem;font-weight:700;transition:transform .18s,box-shadow .18s,border-color .18s;overflow:hidden}
.card:hover{transform:translateY(-3px);border-color:var(--line2);
box-shadow:0 10px 28px rgba(0,0,0,.5),0 0 0 1px rgba(110,235,185,.35)}
.card.win{border-color:var(--green);box-shadow:0 0 0 1px var(--green),0 0 22px rgba(61,216,127,.25)}
.card.final{width:190px;height:74px;font-size:.9rem;border-color:var(--gold);
background:linear-gradient(160deg,rgba(255,211,74,.14),transparent);
box-shadow:0 0 0 2px var(--gold),0 0 40px rgba(255,211,74,.3)}
.card.final:hover{transform:translateY(-3px)}
.teams{display:flex;flex-direction:column;align-items:stretch;width:100%;justify-content:center}
.team{display:flex;justify-content:space-between;align-items:center;font-weight:700;letter-spacing:.02em}
.team .flag{margin-right:7px;font-size:1.15rem}
.team .score{font-variant-numeric:tabular-nums;color:#fff;min-width:2ch;text-align:right}
.team.away .score{color:var(--dim)}
.team.winner{color:var(--gold)}
.team.winner .score{color:var(--gold)}
.note{font-size:.62rem;letter-spacing:.05em;color:var(--gold);font-weight:700}
.venue{position:absolute;left:8px;bottom:1px;font-size:.58rem;color:var(--dim);max-width:128px;
overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
svg{position:absolute;z-index:1;left:0;top:0;pointer-events:none}
path{fill:none;stroke:rgba(110,235,185,.35);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.path3{stroke:rgba(255,211,74,.5);stroke-dasharray:3 5}
#overlay{position:fixed;inset:0;z-index:100;background:rgba(2,8,7,.84);backdrop-filter:blur(6px);
display:none;align-items:center;justify-content:center}
#overlay.open{display:flex;animation:fade .2s}
@keyframes fade{from{opacity:0}}
#modal{position:relative;background:linear-gradient(160deg,#142721,#0a1512);border:1px solid var(--line2);
border-radius:18px;padding:26px 30px;max-width:420px;width:92vw;box-shadow:0 24px 70px rgba(0,0,0,.7)}

#modal .roundname{font-size:1.08rem;font-weight:800;margin-bottom:14px}
#modal .pair{display:flex;flex-direction:column;gap:10px}
#modal .row{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-radius:10px;

#modal .row.winner{border-color:var(--green);background:rgba(61,216,127,.1)}
#modal .flag{margin-right:8px}
#modal .nm{font-weight:700;font-size:.95rem}
#modal .sc{font-weight:800;color:var(--gold);font-variant-numeric:tabular-nums;font-size:1.1rem}
#modal .winner{color:var(--gold);font-size:.7rem;font-weight:700;letter-spacing:.06em;margin:8px 0 4px}
#modal .meta{color:var(--dim);font-size:.8rem;margin-top:12px;display:flex;gap:14px;flex-wrap:wrap}
#modal .meta b{color:var(--txt)}
#close{position:absolute;top:14px;right:14px;font-size:1.4rem;color:var(--dim);cursor:pointer;background:none;border:0}
#close:hover{color:var(--gold)}
footer{position:fixed;bottom:0;left:0;right:0;z-index:50;background:linear-gradient(0deg,rgba(5,12,10,.9));

header{font-size:.85rem}h1{font-size:.95rem}.champ{display:none}}
</style></head><body>
